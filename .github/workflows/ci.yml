name: CI

on:
  push:
    branches: [main]
  pull_request:

# GITHUB_TOKEN の権限を明示する。このワークフローは checkout とビルドしかせず
# 書き込みは要らない。リポジトリ既定の設定に依存させないため個別に絞る。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: データ検証（スキーマ・重複・出典カバレッジ）
        run: pnpm lint:data
      - name: CLI / MCP テスト
        run: pnpm test
      - name: サイトビルド
        run: pnpm build
