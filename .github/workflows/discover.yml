name: 語の候補を集める

# 新しく出たツールを週に一度ひろって、候補一覧の Issue にする。
# 読みを決めるのは人の担当なので、このワークフローは候補を並べるだけで
# 語の追加はしない。追加は entry-verify / entry-add で行う。
#
# PR ではなく Issue にしているのは、GITHUB_TOKEN では PR を作れない
# （Actions は既定で PR の作成を禁じられている）のに対し、Issue は作れるため。
# 候補一覧はコードの変更ではなくやることリストなので、Issue の方が素直でもある。
on:
  schedule:
    # 毎時ちょうどは Actions の混雑で遅延しやすいと公式に明記されているため
    # 意図的にずらしている。月曜の朝に見られるよう日曜 22:17 UTC = 月曜 7:17 JST。
    - cron: "17 22 * * 0"
  workflow_dispatch:

# 前の実行が終わっていなければ待つ。状態ブランチを触るので重ねない。
concurrency:
  group: discovery
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  # 既出の記録を置くブランチ。main は ruleset で保護されていて
  # Actions から push できないため、状態だけを別ブランチに逃がしている。
  STATE_BRANCH: discovery-state

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 収録済みの語と突き合わせるために generated/entries.json が要る
      - name: データ生成
        run: pnpm run data

      - name: 既出の記録を取り出す
        run: |
          if git show "origin/$STATE_BRANCH:discovery/seen.json" > "$RUNNER_TEMP/seen.json" 2>/dev/null; then
            echo "既出 $(node -p "require('$RUNNER_TEMP/seen.json').seen.length") 件を引き継ぎます"
          else
            echo '{"seen": []}' > "$RUNNER_TEMP/seen.json"
            echo "$STATE_BRANCH がまだ無いので空から始めます"
          fi

      - name: 候補を収集
        id: run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEEN_PATH: ${{ runner.temp }}/seen.json
          OUT_PATH: ${{ runner.temp }}/candidates.md
        run: echo "count=$(node scripts/discover.mjs)" >> "$GITHUB_OUTPUT"

      - name: Issue を出す
        if: steps.run.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ steps.run.outputs.count }}
        run: |
          body="$RUNNER_TEMP/candidates.md"
          {
            echo
            echo "---"
            echo
            echo "🤖 \`.github/workflows/discover.yml\` が毎週更新します。対応が済んだら閉じてください。"
          } >> "$body"

          # 実行ページにも残しておく。Issue を消しても後から辿れる
          cat "$body" >> "$GITHUB_STEP_SUMMARY"

          gh label create discovery --color BFD4F2 --description "語の候補" --force >/dev/null 2>&1 || true

          title="語の候補 ${COUNT} 件"
          num=$(gh issue list --label discovery --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue edit "$num" --title "$title" --body-file "$body"
            echo "Issue #$num を更新しました"
          else
            gh issue create --label discovery --title "$title" --body-file "$body"
          fi

      # 次回に同じものを並べないよう、出した名前を記録して残す。
      # 候補が無かった週は seen.json も変わらないので、この手順ごと空振りする。
      - name: 既出の記録を保存する
        run: |
          cp "$RUNNER_TEMP/seen.json" "$RUNNER_TEMP/seen-new.json"
          git checkout -B "$STATE_BRANCH" "origin/$STATE_BRANCH" 2>/dev/null \
            || git checkout -B "$STATE_BRANCH" origin/main
          mkdir -p discovery
          cp "$RUNNER_TEMP/seen-new.json" discovery/seen.json
          if git diff --quiet -- discovery/seen.json; then
            echo "既出の記録に変化はありません"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discovery/seen.json
          git commit -m "chore(discovery): 既出の記録を更新"
          git push origin "$STATE_BRANCH"
